[project]
name = "bob"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=25.1.0",
    "datasets>=3.6.0",
    "hf-xet>=1.1.5",
    "langgraph>=0.5.1",
    "outlines[transformers]>=1.0.3",
    "pydantic>=2.11.7",
    "pylint>=3.3.7",
    "sentence-transformers>=5.0.0",
    "torch>=2.7.0",
    "transformers>=4.53.0",
]

[tool.uv.sources]
torch = [
    {index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
